# CodeRabbit 的评审配置。
#
# 评审规矩这份只做转发，不装 —— 和 .github/copilot-instructions.md、CLAUDE.md 同一个形状。
# 规矩的正本在根目录 REVIEW.md，那里只有指针，真规则在 process/ 与 docs/。
# 另有一个开关在末尾（auto_review），不是规矩，见那里的注释。
reviews:
  path_instructions:
    - path: "**"
      instructions: |
        本仓库的评审须知在根目录 `REVIEW.md`，先读它，再读它指向的那几份。
        这里不复述规则 —— 复述一份就多一份会漂的副本。
        一条要求特别强调：看不见 diff 之外的东西时说「我不知道」，不要补全。
  # 回访 PR（docs/REVISIT.md）按标题跳过自动评审；为什么按标题、关键词怎么定：ADR-151 第十节。
  # 标题的写法在说明书「日期、「本跑」与 PR」那节，那里一改，这一行就对不上了。
  auto_review:
    ignore_title_keywords:
      - "回访台账 20"
