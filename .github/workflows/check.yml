name: check

on:
  push:
  pull_request:

# 只读:检查链不写任何东西
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 体量闸门要和主干求 merge-base；浅克隆下它会拒答而不是放行
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # 2026-09-04 起 `npm ci` 从两秒变成七分钟,同样 6 个包、
      # 同样命中缓存。--prefer-offline 有缓存就不回源问元数据,--no-audit 去掉装完
      # 之后那次审计请求
      - run: npm ci --prefer-offline --no-audit
      # 与本地 `npm run check` 是同一条链 —— 谁跑都一样红
      - run: npm run check
        env:
          # 直推主干时，决策记录的基线要退回整次推送之前 —— 一次推多个提交时
          # HEAD^1 已经包含了删除。PR 事件下这个值为空，脚本会忽略它。
          GIT_PUSH_BEFORE: ${{ github.event.before }}
